[project]
name = "voice-asr-server"
version = "0.1.0"
description = "Local OpenAI-compatible ASR service (Qwen3-ASR-1.7B) for fcitx5-vinput"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "soundfile>=0.13",
    "soxr>=0.5",
    "av>=14",
    "numpy>=2",
]

[tool.uv]
package = false
